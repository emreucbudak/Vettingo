    depends_on:
      postgres:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      JwtSettings__Audience: VettingoAuthServiceClients
      JwtSettings__Issuer: VettingoAuthService
      JwtSettings__SecretKey: "${VETTINGO_JWT_SECRET:?VETTINGO_JWT_SECRET must be set}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=JobServiceDb;Username=vettingo;Password=${VETTINGO_POSTGRES_PASSWORD:-VettingoPostgres_2026!}
      ConnectionStrings__RabbitMq: amqp://vettingo:VettingoRabbit_2026!@rabbitmq:5672/
      ConnectionStrings__Redis: redis:6379,password=VettingoRedis_2026!,abortConnect=false
      DOTNET_RUNNING_IN_CONTAINER: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Password: VettingoRabbit_2026!
      RabbitMq__Port: "5672"
      RabbitMq__UserName: vettingo
      RabbitMq__VirtualHost: /
      Redis__ConnectionString: redis:6379,password=VettingoRedis_2026!,abortConnect=false
    image: vettingo/job-api:local
    init: true
    ports:
      - mode: ingress
        target: 8080
        published: "5257"
        protocol: tcp
    restart: unless-stopped
  notification-api:
    build:
      context: ..
      dockerfile: src/NotificationService/Vettingo.NotificationService.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      JwtSettings__Audience: VettingoAuthServiceClients
      JwtSettings__Issuer: VettingoAuthService
      JwtSettings__SecretKey: "${VETTINGO_JWT_SECRET:?VETTINGO_JWT_SECRET must be set}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=NotificationServiceDb;Username=vettingo;Password=${VETTINGO_POSTGRES_PASSWORD:-VettingoPostgres_2026!}
      ConnectionStrings__RabbitMq: amqp://vettingo:VettingoRabbit_2026!@rabbitmq:5672/
      ConnectionStrings__Redis: redis:6379,password=VettingoRedis_2026!,abortConnect=false
      DOTNET_RUNNING_IN_CONTAINER: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Password: VettingoRabbit_2026!
      RabbitMq__Port: "5672"
      RabbitMq__UserName: vettingo
      RabbitMq__VirtualHost: /
      Redis__ConnectionString: redis:6379,password=VettingoRedis_2026!,abortConnect=false
    image: vettingo/notification-api:local
    init: true
    ports:
      - mode: ingress
        target: 8080
        published: "5149"
        protocol: tcp
    restart: unless-stopped
  postgres:
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${VETTINGO_POSTGRES_PASSWORD:-VettingoPostgres_2026!}
      POSTGRES_USER: vettingo
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U vettingo -d postgres
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 10s
    image: postgres:16-alpine
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
        volume: {}
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: VettingoRabbit_2026!
      RABBITMQ_DEFAULT_USER: vettingo
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 20s
    image: rabbitmq:3.13-management-alpine
    ports:
      - mode: ingress
        target: 5672
        published: "5672"
        protocol: tcp
      - mode: ingress
        target: 15672
        published: "15672"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: rabbitmq-data
        target: /var/lib/rabbitmq
        volume: {}
  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - VettingoRedis_2026!
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - VettingoRedis_2026!
        - ping
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 5s
    image: redis:8.8
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis-data
        target: /data
        volume: {}
volumes:
  postgres-data:
    name: vettingo_postgres-data
  rabbitmq-data:
    name: vettingo_rabbitmq-data
  redis-data:
    name: vettingo_redis-data
