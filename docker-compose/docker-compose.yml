name: vettingo
services:
  analytics-api:
    build:
      context: ..
      dockerfile: src/AnalyticsService/Vettingo.AnalyticsService.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      JwtSettings__Audience: VettingoAuthServiceClients
      JwtSettings__Issuer: VettingoAuthService
      JwtSettings__SecretKey: "${VETTINGO_JWT_SECRET:?VETTINGO_JWT_SECRET must be set}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=AnalyticsServiceDb;Username=vettingo;Password=${VETTINGO_POSTGRES_PASSWORD:-VettingoPostgres_2026!}
      ConnectionStrings__RabbitMq: amqp://vettingo:VettingoRabbit_2026!@rabbitmq:5672/
      ConnectionStrings__Redis: redis:6379,password=VettingoRedis_2026!,abortConnect=false
      DOTNET_RUNNING_IN_CONTAINER: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Password: VettingoRabbit_2026!
      RabbitMq__Port: "5672"
      RabbitMq__UserName: vettingo
      RabbitMq__VirtualHost: /
      Redis__ConnectionString: redis:6379,password=VettingoRedis_2026!,abortConnect=false
    image: vettingo/analytics-api:local
    init: true
    ports:
      - mode: ingress
        target: 8080
        published: "5266"
        protocol: tcp
    restart: unless-stopped
  application-api:
    build:
      context: ..
      dockerfile: src/ApplicationService/Vettingo.ApplicationService.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      JwtSettings__Audience: VettingoAuthServiceClients
      JwtSettings__Issuer: VettingoAuthService
      JwtSettings__SecretKey: "${VETTINGO_JWT_SECRET:?VETTINGO_JWT_SECRET must be set}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ApplicationServiceDb;Username=vettingo;Password=${VETTINGO_POSTGRES_PASSWORD:-VettingoPostgres_2026!}
      DOTNET_RUNNING_IN_CONTAINER: "true"
    image: vettingo/application-api:local
    init: true
    ports:
      - mode: ingress
        target: 8080
        published: "5267"
        protocol: tcp
    restart: unless-stopped
  auth-api:
