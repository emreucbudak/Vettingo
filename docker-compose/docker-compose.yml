      dockerfile: src/ExamService/Vettingo.ExamService.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      rabbitmq:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      JwtSettings__Audience: VettingoAuthServiceClients
